
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Happy 20/10 💖</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#030008;overflow:hidden;font-family:Arial,sans-serif}
canvas{position:fixed;inset:0;width:100%;height:100%}
.text{
  position:fixed;top:7%;left:0;width:100%;
  text-align:center;padding:0 12px;
  animation:appear 3s ease both
}
h1{
  font-size:clamp(22px,4vw,43px);
  color:#ff8acb;letter-spacing:2px;
  text-shadow:0 0 8px #ff168b,0 0 22px #ff168b,0 0 45px #ff0077
}
p{
  margin-top:14px;font-size:clamp(13px,2vw,19px);
  line-height:1.8;color:#ffe3f2;
  text-shadow:0 0 10px #ff3b9d
}
.bottom{
  position:fixed;bottom:6%;width:100%;
  text-align:center;color:#ffb6dd;
  font-size:clamp(13px,2vw,19px);letter-spacing:2px;
  text-shadow:0 0 12px #ff168b,0 0 25px #ff168b;
  animation:glow 2s infinite alternate
}
@keyframes appear{
  from{opacity:0;transform:translateY(-20px)}
  to{opacity:1;transform:translateY(0)}
}
@keyframes glow{from{opacity:.6}to{opacity:1}}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div class="text">
  <h1>💖 HAPPY 20/10 💖</h1>
  <p>
    Chúc các bạn nữ luôn xinh đẹp, rạng rỡ và hạnh phúc! 🌷<br>
    Mong mọi điều dịu dàng nhất sẽ đến với các bạn.<br>
    Luôn tự tin, tỏa sáng và được yêu thương mỗi ngày! ✨
  </p>
</div>

<div class="bottom">✨ YOU ARE SPECIAL ✨ ♡</div>

<script>
let c=document.getElementById('c'),
x=c.getContext('2d'),w,h,ps=[],stars=[],tm=0;

function rs(){
  w=c.width=innerWidth;
  h=c.height=innerHeight;
  x.setTransform(1,0,0,1,0,0);
  x.fillStyle='#030008';
  x.fillRect(0,0,w,h);
}
onresize=rs;
rs();

function heart(t){
  return[
    16*Math.sin(t)**3,
    -(13*Math.cos(t)-5*Math.cos(2*t)
    -2*Math.cos(3*t)-Math.cos(4*t))
  ];
}

// Hạt sáng bên trong trái tim
for(let i=0;i<4000;i++){
  let t=Math.random()*Math.PI*2;
  let r=Math.sqrt(Math.random());
  let [a,b]=heart(t);
  ps.push({
    tx:a*r,ty:b*r,
    x:(Math.random()-.5)*50,
    y:(Math.random()-.5)*50,
    s:Math.random()*1.8+.3,
    d:Math.random()*3,
    hue:Math.random()*35
  });
}

// Các ngôi sao nền
for(let i=0;i<180;i++){
  stars.push({
    x:Math.random()*2-1,
    y:Math.random()*2-1,
    s:Math.random()*2,
    a:Math.random()*6.28
  });
}

function draw(){
  requestAnimationFrame(draw);
  tm+=.016;

  // Nền tối tạo vệt sáng chuyển động
  x.fillStyle='rgba(3,0,8,0.19)';
  x.fillRect(0,0,w,h);

  let scale=Math.min(w/550,h/650,1);
  let beat=1+Math.sin(tm*2.5)*.035;
  let cx=w/2,cy=h*.55;
  let sz=15*scale*beat;

  // Quầng sáng phía sau trái tim
  let g=x.createRadialGradient(cx,cy,5,cx,cy,230*scale);
  g.addColorStop(0,'rgba(255,0,120,0.17)');
  g.addColorStop(.5,'rgba(180,0,255,0.06)');
  g.addColorStop(1,'rgba(0,0,0,0)');
  x.fillStyle=g;
  x.fillRect(0,0,w,h);

  x.save();
  x.translate(cx,cy);
  x.scale(sz,sz);

  // Đường bao bằng các điểm sáng, không có viền liền nét
  x.save();
  for(let i=0;i<650;i++){
    let t=i*Math.PI*2/650;
    let [a,b]=heart(t);
    let flicker=.25+.75*(.5+.5*Math.sin(tm*3+i*1.7));
    let size=.025+flicker*.055;

    x.beginPath();
    x.arc(a,b,size,0,Math.PI*2);
    x.fillStyle=`rgba(255,${100+Math.floor(flicker*100)},${180+Math.floor(flicker*75)},${flicker})`;
    x.shadowBlur=1.1;
    x.shadowColor='#ff168b';
    x.fill();
  }
  x.restore();

  // Bụi sáng bên trong trái tim
  ps.forEach(p=>{
    if(tm>p.d){
      p.x+=(p.tx-p.x)*.065;
      p.y+=(p.ty-p.y)*.065;
    }
    let flicker=.5+Math.random()*.5;
    x.fillStyle=`hsla(${325+p.hue},100%,${65+flicker*30}%,${flicker})`;
    x.shadowBlur=1;
    x.shadowColor='#ff168b';
    x.beginPath();
    x.arc(p.x,p.y,p.s/15,0,Math.PI*2);
    x.fill();
  });

  x.restore();

  // Tia sáng neon ở giữa
  let beam=x.createLinearGradient(0,cy-h*.42,0,cy+h*.42);
  beam.addColorStop(0,'rgba(255,0,130,0)');
  beam.addColorStop(.5,`rgba(255,60,170,${.35+Math.sin(tm*3)*.2})`);
  beam.addColorStop(1,'rgba(255,0,130,0)');

  x.save();
  x.shadowBlur=25;
  x.shadowColor='#ff168b';
  x.strokeStyle=beam;
  x.lineWidth=2;
  x.beginPath();
  x.moveTo(cx,cy-h*.42);
  x.lineTo(cx,cy+h*.42);
  x.stroke();
  x.restore();

  // Sao lấp lánh khắp màn hình
  stars.forEach(s=>{
    s.a+=.025;
    let xx=(s.x+1)*w/2;
    let yy=(s.y+1)*h/2;
    let alpha=.2+.8*(.5+.5*Math.sin(s.a));
    x.fillStyle=`rgba(255,190,230,${alpha})`;
    x.shadowBlur=10;
    x.shadowColor='#ff3b9d';
    x.beginPath();
    x.arc(xx,yy,s.s*(.6+alpha),0,Math.PI*2);
    x.fill();
  });

  x.shadowBlur=0;
}
draw();
</script>
</body>
</html>
